name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/dast.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read
  deployments: write # Allows GitHub to log deployment events in Environments tab

jobs:
  # ── 1. Database Migrations ──
  migrate:
    name: Database Migrations
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run Alembic migrations
        env:
          APP_ENV: dev
          SSM_ENABLED: "false"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SCHEMA: gratitude_bot
        run: |
          uv run alembic upgrade head

  # ── 2. Infrastructure & Lambda Deployment ──
  deploy:
    name: Deploy to AWS Dev
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ steps.smoke_test.outputs.health_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --no-dev

      - name: Debug OIDC Token Claims
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          echo "=== Debugging OIDC & Secret Configuration ==="
          if [ -z "$ROLE_ARN" ]; then
            echo "ERROR: AWS_ROLE_ARN secret is empty!"
          else
            echo "AWS_ROLE_ARN is populated (starts with: ${ROLE_ARN:0:20}...)"
          fi

          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          python3 -c "
          import sys, json, base64
          token = sys.argv[1]
          if not token or token == 'null':
              print('ERROR: Failed to retrieve OIDC token from GitHub Actions runtime')
              sys.exit(0)
          parts = token.split('.')
          payload = parts[1] + '=' * (-len(parts[1]) % 4)
          data = json.loads(base64.urlsafe_b64decode(payload))
          print('--- GitHub Actions OIDC Token Claims ---')
          print('iss (issuer):', data.get('iss'))
          print('aud (audience):', data.get('aud'))
          print('sub (subject):', data.get('sub'))
          print('repository:', data.get('repository'))
          print('environment:', data.get('environment'))
          print('ref:', data.get('ref'))
          print('-----------------------------------------')
          " "$TOKEN"

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init & Apply
        working-directory: terraform/environments/dev
        env:
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          terraform init
          terraform apply -auto-approve

      # ── 3. Post-Deployment Verification ──
      - name: Smoke Test Health Endpoint
        id: smoke_test
        working-directory: terraform/environments/dev
        run: |
          WEBHOOK_URL=$(terraform output -raw webhook_url)
          HEALTH_URL="${WEBHOOK_URL%/telegram/webhook}/health"
          echo "health_url=$HEALTH_URL" >> $GITHUB_OUTPUT
          echo "Verifying health at $HEALTH_URL..."

          READY=0
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "Health check passed with HTTP 200!"
              READY=1
              break
            fi
            echo "Attempt $i: Received HTTP $STATUS, retrying in 5s..."
            sleep 5
          done

          if [ $READY -ne 1 ]; then
            echo "Smoke test failed! Service did not return HTTP 200 in time."
            exit 1
          fi

      - name: Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Deployment to Dev Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment:** AWS \`dev\` (\`ap-southeast-1\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Endpoint:** ${{ steps.smoke_test.outputs.health_url }}" >> $GITHUB_STEP_SUMMARY
