name: CD

on:
  push:
    branches:
      - develop
      - sit
      - "release/**"
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/dast.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - sit
          - prod
      force_deploy:
        description: "Force deploy (bypass placeholder check)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.environment || 'auto' }}
  cancel-in-progress: false

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read
  deployments: write # Allows GitHub to log deployment events in Environments tab

jobs:
  # ── 0. Resolve Target Environment ──
  resolve_env:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set_env.outputs.environment }}
      deploy_enabled: ${{ steps.set_env.outputs.deploy_enabled }}
    steps:
      - name: Determine Environment
        id: set_env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.environment }}"
            FORCE="${{ inputs.force_deploy }}"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            TARGET="dev"
            FORCE="false"
          elif [ "${{ github.ref }}" = "refs/heads/sit" ] || [[ "${{ github.ref }}" =~ ^refs/heads/release/ ]]; then
            TARGET="sit"
            FORCE="false"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET="prod"
            FORCE="false"
          else
            TARGET="dev"
            FORCE="false"
          fi

          DEPLOY_ENABLED="true"
          if [ "$FORCE" != "true" ]; then
            if [ "$TARGET" = "prod" ] && [ "${{ vars.ENABLE_PROD_DEPLOY }}" != "true" ]; then
              echo "Production ($TARGET) is configured as a placeholder. Automated deployment disabled."
              DEPLOY_ENABLED="false"
            elif [ "$TARGET" = "sit" ] && [ "${{ vars.ENABLE_SIT_DEPLOY }}" != "true" ]; then
              echo "SIT ($TARGET) is configured as a placeholder. Automated deployment disabled."
              DEPLOY_ENABLED="false"
            fi
          fi

          echo "Target environment: $TARGET"
          echo "Deploy enabled: $DEPLOY_ENABLED"
          echo "environment=$TARGET" >> $GITHUB_OUTPUT
          echo "deploy_enabled=$DEPLOY_ENABLED" >> $GITHUB_OUTPUT

  # ── 1. Database Migrations ──
  migrate:
    name: Database Migrations
    needs: resolve_env
    if: needs.resolve_env.outputs.deploy_enabled == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve_env.outputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run Alembic migrations
        env:
          APP_ENV: ${{ needs.resolve_env.outputs.environment }}
          SSM_ENABLED: "false"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SCHEMA: gratitude_bot
        run: |
          uv run alembic upgrade head

  # ── 2. Infrastructure & Lambda Deployment ──
  deploy:
    name: Deploy to AWS
    needs: [resolve_env, migrate]
    if: needs.resolve_env.outputs.deploy_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve_env.outputs.environment }}
      url: ${{ steps.smoke_test.outputs.health_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip and install packaging tools
        run: |
          python3.12 -m pip install --upgrade pip setuptools wheel

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN || secrets.TP_API_TOKEN || secrets.TF_TOKEN }}

      - name: Terraform Init & Apply
        working-directory: terraform/environments/${{ needs.resolve_env.outputs.environment }}
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN || secrets.TP_API_TOKEN || secrets.TF_TOKEN }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          terraform init
          terraform apply -auto-approve

      # ── 3. Post-Deployment Verification ──
      - name: Smoke Test Health Endpoint
        id: smoke_test
        working-directory: terraform/environments/${{ needs.resolve_env.outputs.environment }}
        run: |
          WEBHOOK_URL=$(terraform output -raw webhook_url)
          HEALTH_URL="${WEBHOOK_URL%/telegram/webhook}/health"
          echo "health_url=$HEALTH_URL" >> $GITHUB_OUTPUT
          echo "Verifying health at $HEALTH_URL..."

          READY=0
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "Health check passed with HTTP 200!"
              READY=1
              break
            fi
            echo "Attempt $i: Received HTTP $STATUS, retrying in 5s..."
            sleep 5
          done

          if [ $READY -ne 1 ]; then
            echo "Smoke test failed! Service did not return HTTP 200 in time."
            exit 1
          fi

      - name: Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Deployment Summary (${{ needs.resolve_env.outputs.environment }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment:** AWS \`${{ needs.resolve_env.outputs.environment }}\` (\`ap-southeast-1\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Endpoint:** ${{ steps.smoke_test.outputs.health_url }}" >> $GITHUB_STEP_SUMMARY

  # ── 3. Placeholder / Disabled Environment Notice ──
  placeholder:
    name: Placeholder Notice
    needs: resolve_env
    if: needs.resolve_env.outputs.deploy_enabled != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Environment Disabled Notice
        run: |
          TARGET="${{ needs.resolve_env.outputs.environment }}"
          ENV_UPPER=$(echo "$TARGET" | tr '[:lower:]' '[:upper:]')
          echo "### ⏸️ Deployment Skipped: $TARGET (Placeholder)" >> $GITHUB_STEP_SUMMARY
          echo "The **$TARGET** environment is currently configured as a placeholder." >> $GITHUB_STEP_SUMMARY
          echo "Automated deployments to this environment are disabled so pipeline runs do not fail." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### How to Enable Deployments for $TARGET:" >> $GITHUB_STEP_SUMMARY
          echo "1. Configure the required secrets (\`AWS_ROLE_ARN\`, \`DATABASE_URL\`, \`TELEGRAM_BOT_TOKEN\`, \`TF_API_TOKEN\`) in GitHub **Settings > Environments > $TARGET**." >> $GITHUB_STEP_SUMMARY
          echo "2. Set the repository variable \`ENABLE_${ENV_UPPER}_DEPLOY=true\` in **Settings > Secrets and variables > Actions > Variables** (or trigger manually via **Run workflow** with **Force deploy** checked)." >> $GITHUB_STEP_SUMMARY
