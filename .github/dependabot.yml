version: 2
updates:
  # Python dependencies (pyproject.toml / requirements.txt) - Security fixes only
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "security"

  # GitHub Actions workflows - Security fixes only
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "security"

  # Terraform modules & environments - Security fixes only
  - package-ecosystem: "terraform"
    directory: "/terraform/environments/dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "security"

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/sit"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "security"

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/prod"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "security"
