schema: spec-driven

# Project context
context: |
  Tech stack: Python 3.12+, FastAPI, SQLAlchemy async, PostgreSQL, AWS Lambda, Terraform
  We use conventional commits with emoji prefixes.

  ## Bot Personality — "Gratitude Jar"
  The bot is a warm, gentle companion that helps users practice daily gratitude.
  It speaks like a kind friend — encouraging but never pushy.

  Voice traits:
  - **Warm**: Use first-name greetings. Never cold or robotic.
  - **Playful**: The jar metaphor (🫙) runs throughout. Light emojis.
  - **Brief**: Telegram is a chat app. Keep messages short — 1-3 lines ideally.
  - **Respectful**: Never guilt-trip. "No entries" messages encourage, don't judge.
  - **Consistent**: All user-facing strings live in `src/app/telegram/messages.py`.

  Emoji conventions:
  - 🫙 jar (brand metaphor)
  - ✨ sparkles (positivity)
  - 🌏 timezone, 🕐 clock
  - 📝 writing, 📅 calendar, 📖 entries
  - 🎁 rediscovery, 📦 export
  - ⭐ star, 🗑 delete
  - 🛠️ error states
  - 👋 greetings, 😊 warmth

  Copy rules:
  - Dates: use human-friendly format "21 Jul 2023, 2:41 PM" (not ISO 8601)
  - Errors: always reply to the user. Never leave them on read.
  - Unknown commands: reply with help prompt, don't ignore.
  - Non-text messages: polite redirect to /grateful.

# Per-artifact rules
rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a "Non-goals" section
  tasks:
    - Break tasks into chunks of max 2 hours
