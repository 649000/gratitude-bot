[project]
name = "gratitude-bot"
version = "0.1.0"
description = "Telegram gratitude bot with FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "mangum>=0.19.0",
    "python-telegram-bot>=21.10.0",
    "httpx>=0.28.0",
    "pytz>=2024.2",
    "aws-lambda-powertools>=2.43.0",
]

[project.optional-dependencies]
server = [
    "uvicorn[standard]>=0.51.0",
]
dev = [
    "uvicorn[standard]>=0.51.0",
    "boto3>=1.35.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]
ignore = ["B008", "ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
warn_return_any = false
disable_error_code = ["union-attr", "type-arg"]

[[tool.mypy.overrides]]
module = [
    "app.config",
    "scheduler.common.config",
]
disable_error_code = ["call-arg", "arg-type"]

[[tool.mypy.overrides]]
module = [
    "app.models.*",
]
disable_error_code = ["name-defined"]

[[tool.mypy.overrides]]
module = [
    "app.telegram.handlers.db",
    "scheduler.dispatcher.dispatch",
]
disable_error_code = ["operator"]

[[tool.mypy.overrides]]
module = [
    "app.telegram.handlers.surprise",
    "app.main",
    "app.infrastructure.lambda_handler",
]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = [
    "app.telegram.handlers.start",
]
disable_error_code = ["assignment", "arg-type", "index"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a real database (deselect with '-m \"not integration\"')",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*", "scheduler*", "shared*"]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

